<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cyclecountreport_sg</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface-1:   #fcfcfb;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --muted:       #898781;
    --grid:        #e1e0d9;
    --baseline:    #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    --series-1:    #2a78d6;
    --series-2:    #eb6834;
    --series-3:    #1baf7a;
    --series-4:    #eda100;
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-critical: #d03b3b;
    --delta-up:    #006300;
    --delta-down:  #d03b3b;
    --wash-good:   rgba(12,163,12,0.16);
    --wash-low:    rgba(208,59,59,0.16);
    --wash-row-low:rgba(208,59,59,0.055);
    --chip-good:   rgba(12,163,12,0.13);
    --chip-low:    rgba(208,59,59,0.13);
    --chip-warn:   rgba(250,178,25,0.20);
  }
  :root[data-theme="dark"] { color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface-1:   #1a1a19;
      --ink:         #ffffff;
      --ink-2:       #c3c2b7;
      --muted:       #898781;
      --grid:        #2c2c2a;
      --baseline:    #383835;
      --border:      rgba(255,255,255,0.10);
      --series-1:    #3987e5;
      --series-2:    #d95926;
      --series-3:    #199e70;
      --series-4:    #c98500;
      --delta-up:    #0ca30c;
      --wash-good:   rgba(12,163,12,0.26);
      --wash-low:    rgba(208,59,59,0.30);
      --wash-row-low:rgba(208,59,59,0.10);
      --chip-good:   rgba(12,163,12,0.22);
      --chip-low:    rgba(208,59,59,0.24);
      --chip-warn:   rgba(250,178,25,0.28);
    }
  }
  :root[data-theme="dark"] {
    --page:        #0d0d0d;
    --surface-1:   #1a1a19;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --muted:       #898781;
    --grid:        #2c2c2a;
    --baseline:    #383835;
    --border:      rgba(255,255,255,0.10);
    --series-1:    #3987e5;
    --series-2:    #d95926;
    --series-3:    #199e70;
    --series-4:    #c98500;
    --delta-up:    #0ca30c;
    --wash-good:   rgba(12,163,12,0.26);
    --wash-low:    rgba(208,59,59,0.30);
    --wash-row-low:rgba(208,59,59,0.10);
    --chip-good:   rgba(12,163,12,0.22);
    --chip-low:    rgba(208,59,59,0.24);
    --chip-warn:   rgba(250,178,25,0.28);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .topbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 22px 10px;
  }
  .topbar .sub { color: var(--muted); font-size: 12.5px; }
  .topbar .spacer { flex: 1; }
  .updated { color: var(--ink-2); font-size: 12.5px; }
  .updated .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background: var(--status-good); margin-right:6px; vertical-align: 1px;}
  .updated.err .dot { background: var(--status-critical); }
  button, select, input[type=number], input[type=text], input[type=email], input[type=password] {
    font: inherit; color: var(--ink);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--baseline); }
  button.primary { font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  a { color: var(--series-1); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Country title dropdown */
  .titlebox { position: relative; }
  .titlebtn {
    border: none; background: none; padding: 2px 6px 2px 0;
    font-size: 17px; font-weight: 650; letter-spacing: .1px; color: var(--ink);
    display: flex; align-items: center; gap: 7px;
  }
  .titlebtn .caret { font-size: 11px; color: var(--muted); }
  .titlebtn:hover .caret { color: var(--ink); }
  .titlemenu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; min-width: 230px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: 5px; display: none;
  }
  .titlemenu.open { display: block; }
  .titlemenu button {
    display: flex; width: 100%; border: none; background: none; text-align: left;
    padding: 8px 11px; border-radius: 7px; font-weight: 550; gap: 8px; align-items: center;
  }
  .titlemenu button:hover { background: var(--page); }
  .titlemenu .chk { width: 15px; font-weight: 700; }

  .tabs { display: flex; gap: 4px; padding: 4px 22px 0; flex-wrap: wrap; border-bottom: 1px solid var(--grid); }
  .tab {
    border: none; background: none; padding: 8px 14px 9px; border-radius: 8px 8px 0 0;
    color: var(--ink-2); font-weight: 550; position: relative; font-size: 13.5px;
  }
  .tab:hover { color: var(--ink); background: var(--surface-1); }
  .tab.active { color: var(--ink); }
  .tab.active::after {
    content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:2.5px;
    background: var(--ink); border-radius: 2px;
  }
  .tab .flagn {
    display:inline-block; min-width: 17px; padding: 0 4px; margin-left: 6px;
    background: var(--status-critical); color:#fff; border-radius: 9px;
    font-size: 11px; line-height: 17px; font-weight: 650; text-align:center;
  }

  .filters {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 12px 22px; font-size: 13px; color: var(--ink-2);
  }
  .filters label { display: flex; align-items: center; gap: 7px; }
  .filters input[type=number] { width: 62px; padding: 4px 6px; }
  .legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .legend .key { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border); }

  main { padding: 4px 22px 40px; max-width: 1500px; }
  .loading, .fatal { padding: 60px 0; text-align: center; color: var(--ink-2); }
  .fatal { color: var(--status-critical); }
  .banner {
    margin: 0 22px 10px; padding: 9px 14px; border-radius: 8px;
    background: var(--wash-low); color: var(--ink); font-size: 13px;
    display: flex; gap: 12px; align-items: center;
  }
  .banner button { padding: 3px 10px; }
  .refreshing main { opacity: .55; transition: opacity .2s; }

  .kpis { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 20px; }
  .kpi {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 13px 18px 12px; min-width: 170px; flex: 0 1 auto;
  }
  .kpi.click { cursor: pointer; }
  .kpi.click:hover { border-color: var(--baseline); }
  .kpi .lab { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .kpi .val { font-size: 27px; font-weight: 650; letter-spacing: -.3px; }
  .kpi .val .unit { font-size: 15px; font-weight: 550; color: var(--ink-2); }
  .kpi .sub2 { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .delta { font-size: 12.5px; font-weight: 600; }
  .delta.up { color: var(--delta-up); }
  .delta.down { color: var(--delta-down); }
  .delta.flat { color: var(--muted); font-weight: 500; }

  section.card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 20px;
  }
  section.card h2 { font-size: 14px; font-weight: 650; margin: 0 0 4px; }
  section.card .h2sub { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }

  .attention { border-left: 3px solid var(--status-critical); }
  .attn-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 7px 0; border-top: 1px solid var(--grid); }
  .attn-row:first-of-type { border-top: none; }
  .attn-store { font-weight: 650; min-width: 118px; }
  .attn-brand { color: var(--muted); font-size: 12px; min-width: 90px; }
  .attn-chips { display: flex; gap: 4px; }
  .attn-chip {
    font-size: 11.5px; padding: 2px 7px; border-radius: 5px; font-variant-numeric: tabular-nums;
  }
  .attn-chip.low { background: var(--chip-low); }
  .attn-chip.ok  { background: var(--page); border: 1px solid var(--grid); color: var(--ink-2); }
  .attn-note { color: var(--ink-2); font-size: 12.5px; }
  .goodchips { display: flex; gap: 7px; flex-wrap: wrap; }
  .goodchip {
    background: var(--chip-good); border-radius: 6px; padding: 3px 10px;
    font-size: 12.5px; font-weight: 600;
  }
  .goodchip .v { font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .allok { color: var(--ink-2); font-size: 13px; }

  .matrix-scroll { overflow-x: auto; }
  table.matrix { border-collapse: separate; border-spacing: 2px; font-variant-numeric: tabular-nums; }
  table.matrix th, table.matrix td { padding: 5px 9px; text-align: center; font-size: 12.5px; white-space: nowrap; }
  table.matrix thead th { color: var(--muted); font-weight: 550; background: var(--surface-1); position: sticky; top: 0; }
  table.matrix thead th.latestcol { color: var(--ink); font-weight: 700; }
  table.matrix th.rowhead {
    position: sticky; left: 0; z-index: 2; background: var(--surface-1);
    text-align: left; font-weight: 600; color: var(--ink); min-width: 96px;
  }
  table.matrix thead th.rowhead { z-index: 3; }
  tr.chronic th.rowhead, tr.chronic td { background: var(--wash-row-low); }
  tr.chronic th.rowhead { color: var(--ink); }
  .flagico { color: var(--status-critical); font-weight: 700; margin-left: 5px; font-size: 11.5px; }
  .starico { color: var(--status-good); font-weight: 700; margin-left: 5px; font-size: 11.5px; }
  td.cell { border-radius: 5px; cursor: default; }
  td.cell.hasdata { cursor: pointer; }
  td.cell.good { background: var(--wash-good); }
  td.cell.low  { background: var(--wash-low); }
  td.cell.mid  { background: var(--page); }
  td.cell.nodata { color: var(--baseline); }
  td.cell.pending { color: var(--muted); font-size: 11px; background: var(--page); }
  td.cell:hover, td.cell:focus-visible { outline: 2px solid var(--baseline); outline-offset: -1px; }
  tr.avgrow th.rowhead, tr.avgrow td { border-top: 1px solid var(--grid); color: var(--ink-2); font-weight: 600; background: var(--surface-1); }
  td.dcell { font-weight: 600; }

  /* ---------- Weekly adjustments ---------- */
  .mv { padding: 0 5px; font-size: 10px; line-height: 16px; margin-left: 3px; border-radius: 5px; color: var(--muted); }
  .mv:hover { color: var(--ink); }
  .edit-seq { padding: 0 7px; font-size: 11px; line-height: 18px; margin-left: 7px; border-radius: 5px; color: var(--muted); }
  .edit-seq:hover { color: var(--ink); }
  .edit-seq.on { color: var(--series-1); border-color: var(--series-1); font-weight: 700; }
  .adjwrap { display: flex; gap: 5px; align-items: center; }
  select.adjsel { font-size: 12px; padding: 2px 5px; border-radius: 6px; }
  select.adjsel.s-done { background: var(--chip-good); }
  select.adjsel.s-pending { background: var(--chip-warn); }
  select.adjsel.s-error { background: var(--chip-low); }
  select.adjsel option { background: var(--surface-1); color: var(--ink); }
  button.adjrem { padding: 2px 8px; font-size: 12px; }
  button.adjrem.has { color: var(--series-1); font-weight: 700; border-color: var(--series-1); }
  .adjdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-left: 4px; vertical-align: 2px; }
  .adjdot.done { background: var(--status-good); }
  .adjdot.pending { background: var(--status-warning); }
  .adjdot.error { background: var(--status-critical); }
  #popover .irow { display: flex; gap: 10px; padding: 1.5px 0; font-size: 12.5px; }
  #popover .irow .k { color: var(--ink-2); white-space: nowrap; }
  #popover .irow .v { font-weight: 600; margin-left: auto; text-align: right; overflow-wrap: anywhere; }
  #popover .sep { border-top: 1px solid var(--grid); margin: 9px 0; }
  #popover .qrow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #popover .qrow label { flex: 1; color: var(--ink-2); font-size: 12.5px; }
  #popover .qrow input { width: 92px; padding: 4px 7px; }
  #popover {
    position: fixed; z-index: 60; display: none; width: 300px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.2); padding: 12px; font-size: 13px;
  }
  #popover h3 { margin: 0 0 8px; font-size: 13px; }
  #popover textarea {
    width: 100%; min-height: 64px; margin-top: 8px; font: inherit; resize: vertical;
    background: var(--page); color: var(--ink); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px;
  }
  #popover .prow { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }

  .chart-wrap { width: 100%; position: relative; }
  .chart-wrap svg { display: block; }
  .chart-legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 2px 0 8px; }
  .chart-legend .key { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
  .linekey { width: 16px; height: 0; border-top: 2.5px solid; border-radius: 2px; }

  details.tblview { margin-top: 10px; }
  details.tblview summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
  details.tblview table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  details.tblview th, details.tblview td { border: 1px solid var(--grid); padding: 4px 10px; font-size: 12.5px; text-align: right; }
  details.tblview th:first-child, details.tblview td:first-child { text-align: left; }

  #tooltip {
    position: fixed; z-index: 50; pointer-events: none; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 9px;
    box-shadow: 0 4px 18px rgba(0,0,0,.14);
    padding: 9px 12px; font-size: 12.5px; max-width: 320px;
  }
  #tooltip .tt-title { font-weight: 650; margin-bottom: 4px; }
  #tooltip .tt-row { display: flex; gap: 8px; align-items: baseline; padding: 1.5px 0; }
  #tooltip .tt-row .k { color: var(--ink-2); }
  #tooltip .tt-row .v { font-weight: 650; margin-left: auto; font-variant-numeric: tabular-nums; }
  #tooltip .lk { display:inline-block; width: 12px; border-top: 2.5px solid; border-radius: 2px; vertical-align: 3px; margin-right: 2px; }

  /* ---------- Auth screens ---------- */
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: 28px 26px 24px; width: 360px; max-width: 100%;
  }
  .auth-card h1 { font-size: 18px; margin: 0 0 2px; }
  .auth-card .asub { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
  .auth-card label { display: block; font-size: 12.5px; color: var(--ink-2); margin: 12px 0 4px; }
  .auth-card input { width: 100%; padding: 8px 11px; }
  .auth-card .abtn { width: 100%; margin-top: 18px; padding: 9px; font-weight: 650; border-radius: 8px;
    background: var(--ink); color: var(--page); border: none; }
  .auth-card .abtn:hover { opacity: .88; }
  .auth-err { color: var(--status-critical); font-size: 12.5px; margin-top: 12px; min-height: 16px; }
  .auth-ok  { color: var(--delta-up); font-size: 12.5px; margin-top: 12px; }
  .auth-links { display: flex; justify-content: space-between; margin-top: 14px; font-size: 12.5px; }
  .auth-note { color: var(--muted); font-size: 12px; margin-top: 16px; line-height: 1.5; }

  /* ---------- Settings ---------- */
  .settings-head { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; }
  .settings-head h2 { font-size: 16px; margin: 0; }
  .roletbl { width: 100%; border-collapse: collapse; }
  .roletbl th, .roletbl td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--grid); font-size: 13px; }
  .roletbl thead th { border-top: none; color: var(--muted); font-weight: 550; font-size: 12px; }
  .roletbl select { padding: 4px 8px; }
  .roletbl .cty { display: inline-flex; gap: 10px; }
  .roletbl .cty label { display: inline-flex; gap: 4px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
  .rolebadge { font-size: 11.5px; padding: 2px 8px; border-radius: 9px; font-weight: 600; }
  .rolebadge.admin { background: var(--chip-good); }
  .rolebadge.pending { background: var(--chip-low); }
  .rolebadge.executive { background: var(--page); border: 1px solid var(--grid); }
  .profgrid { max-width: 460px; }
  .profgrid label { display: block; font-size: 12.5px; color: var(--ink-2); margin: 12px 0 4px; }
  .profgrid input { width: 100%; padding: 8px 11px; }
  .profgrid input[disabled] { color: var(--muted); }
</style>
</head>
<body>
<div id="authRoot"></div>
<div id="appRoot" style="display:none">
  <header class="topbar">
    <div class="titlebox" id="titleBox"></div>
    <span class="sub" id="sheetLink"></span>
    <span class="spacer"></span>
    <span class="updated" id="updated"></span>
    <button id="btnRefresh" class="primary" title="Fetch latest data from the Google Sheet">↻ Refresh</button>
    <button id="btnTheme" title="Theme">◐</button>
    <button id="btnSettings" title="Settings" style="display:none">⚙</button>
    <button id="btnSignOut" style="display:none">Sign out</button>
  </header>
  <div id="bannerSlot"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="filters" id="filters"></div>
  <main id="content"><div class="loading">Loading cycle count data from Google Sheets…</div></main>
</div>
<div id="tooltip" role="status"></div>
<div id="popover"></div>

<script>
"use strict";

/* ============================== CONFIG ============================== */
const COUNTRIES = [
  { id: "SG", title: "Cycle Count Report SG", sheetId: "1FrKrNzITjp_daSbNSaV43vUhzAQeVmiyK7AbtiXidDs" },
  { id: "MY", title: "Cycle Count Report MY", sheetId: "1CyEcgxmWKobXs17X-1Vlc-z3H8Vw80QnQm3H7Bs0oy8" },
];
const BRAND_NAMES = { "iORA": "iORA", "SANS": "SANS & SANS", "TRT": "TRT", "MONOLOQ": "MONOLOQ" };
const IGNORE_SHEET = /stock\s*take/i;
const REFRESH_MS = 5 * 60 * 1000;          // auto-refresh every 5 minutes
const SERIES_VARS = ["--series-1", "--series-2", "--series-3", "--series-4"];

// ---- Sign-in (Firebase). Leave null to run the dashboard with sign-in disabled. ----
// The first account registered with ADMIN_EMAIL becomes the Administrator.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA3AHtSB64Bo1AtRjdnXV4JJgKIRt-Eg-g",
  authDomain: "cyclecountreport.firebaseapp.com",
  projectId: "cyclecountreport",
  storageBucket: "cyclecountreport.firebasestorage.app",
  messagingSenderId: "624938816026",
  appId: "1:624938816026:web:f580e846db975c5c34b7a3",
};
const ADMIN_EMAIL = "ng_thianwei@iora.com.my";

// v2 config: red is now "at or below 94%" (was "below 92%") — reset stored thresholds once
if (localStorage.getItem("cc.cfgV") !== "2") {
  localStorage.setItem("cc.cfgV", "2");
  localStorage.removeItem("cc.greenT");
  localStorage.removeItem("cc.lowT");
}
const state = {
  data: {},              // countryId -> { brands, fetchedAt }
  adj: {},               // countryId -> { docId -> adjustment record }
  order: {},             // countryId -> { docId -> store-order record }
  reorder: false,        // true while the admin is rearranging the store sequence
  country: localStorage.getItem("cc.country") || "SG",
  view: "dash",          // dash | settings
  active: localStorage.getItem("cc.tab") || "overview",
  window: +(localStorage.getItem("cc.window") || 12),   // 0 = all
  sort: localStorage.getItem("cc.sort") || "store",
  greenT: +(localStorage.getItem("cc.greenT") || 95),
  lowT: +(localStorage.getItem("cc.lowT") || 94),
  error: null,
  refreshing: false,
  user: null,            // {uid, email, name, role, countries} when sign-in is enabled
};

/* ============================== UTILS ============================== */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
const fmtPct = v => (v * 100).toFixed(1);
const EPS = 1e-9;
const isLow = p => p <= state.lowT / 100 + EPS;    // red: at or below the low threshold
const isHigh = p => p >= state.greenT / 100 - EPS; // green: at or above the high threshold
function serialToDate(n) { return new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000); }
function dLabel(d) { return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", timeZone: "UTC" }); }
function dFull(d)  { return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" }); }
function loadScript(src) {
  return new Promise((ok, bad) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => bad(new Error("Failed to load " + src));
    document.head.append(s);
  });
}
function country() { return COUNTRIES.find(c => c.id === state.country) || COUNTRIES[0]; }
function allowedCountries() {
  if (!FIREBASE_CONFIG || !state.user || state.user.role === "admin") return COUNTRIES;
  return COUNTRIES.filter(c => (state.user.countries || []).includes(c.id));
}

/* ============================== XLSX FETCH + PARSE ============================== */
async function unzip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let eocd = -1;
  for (let i = buf.byteLength - 22, min = Math.max(0, buf.byteLength - 65558); i >= min; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("The response is not a spreadsheet file — check that the sheet is shared as 'Anyone with the link'.");
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const entries = {};
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const cmtLen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    entries[td.decode(u8.subarray(off + 46, off + 46 + nameLen))] = { method, compSize, lho };
    off += 46 + nameLen + extraLen + cmtLen;
  }
  return async function file(name) {
    const e = entries[name];
    if (!e) return null;
    const nl = dv.getUint16(e.lho + 26, true), el = dv.getUint16(e.lho + 28, true);
    const start = e.lho + 30 + nl + el;
    const slice = u8.subarray(start, start + e.compSize);
    if (e.method === 0) return td.decode(slice);
    const stream = new Blob([slice]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return await new Response(stream).text();
  };
}
const xml = s => new DOMParser().parseFromString(s, "application/xml");
const tags = (doc, name) => Array.from(doc.getElementsByTagNameNS("*", name));

function cellValue(c, shared) {
  const t = c.getAttribute("t");
  if (t === "inlineStr") { const s = c.textContent.trim(); return s ? { s, n: null } : null; }
  const v = tags(c, "v")[0];
  if (!v) return null;
  const raw = v.textContent;
  if (t === "s") { const s = (shared[parseInt(raw, 10)] || "").trim(); return s ? { s, n: null } : null; }
  if (t === "str" || t === "e" || t === "b") { const s = raw.trim(); return s ? { s, n: null } : null; }
  const n = parseFloat(raw);
  return isNaN(n) ? null : { s: raw.trim(), n };
}
function sheetRows(doc, shared) {
  const rows = [];
  for (const rowEl of tags(doc, "row")) {
    const cells = {};
    let any = false;
    for (const c of tags(rowEl, "c")) {
      const ref = c.getAttribute("r") || "";
      const col = ref.replace(/\d+/g, "");
      const val = cellValue(c, shared);
      if (val) { cells[col] = val; any = true; }
    }
    if (any) rows.push(cells);
  }
  return rows;
}
function pctOf(cell) {
  if (!cell) return null;
  let n = cell.n;
  if (n == null) {
    const m = /^(\d+(?:\.\d+)?)\s*%$/.exec(cell.s);
    if (!m) return null;
    n = parseFloat(m[1]) / 100;
  }
  if (n > 1.5 && n <= 100) n = n / 100;
  return (n >= 0 && n <= 1.5) ? n : null;
}
function disp(cell) {
  if (!cell) return "";
  if (cell.n != null && Number.isFinite(cell.n)) {
    return Number.isInteger(cell.n) ? String(cell.n) : cell.n.toFixed(2);
  }
  return cell.s;
}

function parseBrandRows(rows) {
  const weeks = [];
  let cur = null;
  for (const cells of rows) {
    const a = cells.A;
    if (!a) continue;
    if (a.n != null && a.n > 40000 && a.n < 60000) {           // week header row (date serial)
      const date = serialToDate(a.n);
      cur = { serial: a.n, date, label: dLabel(date), full: dFull(date), stores: [] };
      weeks.push(cur);
      continue;
    }
    if (!cur || a.n != null) continue;                          // store rows have text codes in col A
    const parts = ["D", "E", "F"].map(col => pctOf(cells[col])).filter(p => p != null);
    cur.stores.push({
      store: a.s,
      status: cells.B ? cells.B.s : "",
      countDate: disp(cells.C),
      parts,
      pct: parts.length ? parts.reduce((x, y) => x + y, 0) / parts.length : null,
      missing: disp(cells.G),
      updateLoc: disp(cells.H),
      checkIn: disp(cells.I),
      remark: ["J", "K", "L", "M"].map(col => cells[col] ? cells[col].s : "").filter(Boolean).join(" — "),
    });
  }
  const withInfo = weeks.filter(w => w.stores.some(s => s.status || s.pct != null || s.countDate));
  // Keep weeks that have at least one recorded percentage, plus the newest
  // in-progress week (statuses logged but no counts yet).
  const withPct = withInfo.filter(w => w.stores.some(s => s.pct != null));
  const last = withInfo[withInfo.length - 1];
  if (last && !withPct.includes(last)) withPct.push(last);
  return withPct;
}

async function loadData(sheetId) {
  const url = "https://docs.google.com/spreadsheets/d/" + sheetId + "/export?format=xlsx&_cb=" + Date.now();
  let res;
  try { res = await fetch(url, { cache: "no-store" }); }
  catch (e) { throw new Error("Could not reach Google Sheets. Check your internet connection."); }
  if (!res.ok) throw new Error("Google Sheets returned HTTP " + res.status + ". Check that the sheet is shared as 'Anyone with the link — Viewer'.");
  const file = await unzip(await res.arrayBuffer());

  const wbDoc = xml(await file("xl/workbook.xml"));
  const relDoc = xml(await file("xl/_rels/workbook.xml.rels"));
  const ssXml = await file("xl/sharedStrings.xml");
  const shared = ssXml ? tags(xml(ssXml), "si").map(si => si.textContent) : [];

  const relMap = {};
  for (const r of tags(relDoc, "Relationship")) {
    relMap[r.getAttribute("Id")] = r.getAttribute("Target").replace(/^\//, "");
  }
  const brands = [];
  for (const sh of tags(wbDoc, "sheet")) {
    const name = sh.getAttribute("name");
    if (IGNORE_SHEET.test(name)) continue;
    const rid = sh.getAttribute("r:id") || sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
    let target = relMap[rid];
    if (!target) continue;
    if (!target.startsWith("xl/")) target = "xl/" + target.replace(/^\.\.\//, "");
    const doc = xml(await file(target));
    const weeks = parseBrandRows(sheetRows(doc, shared));
    if (weeks.length) brands.push({ sheet: name, name: BRAND_NAMES[name] || name, weeks });
  }
  if (!brands.length) throw new Error("No cycle-count data found in the sheet — the tab layout may have changed.");
  return brands;
}

/* ============================== DERIVED DATA ============================== */
function activeBrands() {
  const d = state.data[state.country];
  return d ? d.brands : [];
}
function windowWeeks(brand) {
  const w = brand.weeks;
  return state.window > 0 ? w.slice(-state.window) : w.slice();
}
function buildMatrix(brand) {
  const weeks = windowWeeks(brand);
  const stores = new Map();      // store -> entries[] aligned to weeks
  weeks.forEach((week, wi) => {
    for (const e of week.stores) {
      if (!stores.has(e.store)) stores.set(e.store, new Array(weeks.length).fill(null));
      const slot = stores.get(e.store);
      if (!slot[wi] || (slot[wi].pct == null && e.pct != null)) slot[wi] = e;
    }
  });
  const rows = [...stores.entries()].map(([store, entries]) => {
    const counted = entries.map((e, wi) => e && e.pct != null ? { wi, pct: e.pct } : null).filter(Boolean);
    const recent = counted.slice(-4);
    const lows  = recent.filter(c => isLow(c.pct)).length;
    const highs = recent.filter(c => isHigh(c.pct)).length;
    let streak = 0;
    for (let i = counted.length - 1; i >= 0 && isLow(counted[i].pct); i--) streak++;
    const latest = counted[counted.length - 1] || null;
    const prev = counted[counted.length - 2] || null;
    return {
      store, entries, counted, recent,
      chronicLow: counted.length >= 3 && lows >= 3,
      chronicHigh: counted.length >= 3 && highs >= 3,
      streak, latest,
      delta: latest && prev ? latest.pct - prev.pct : null,
    };
  });
  const customOrder = getStoreOrder(brand);
  rows.sort((a, b) => {
    if (state.sort === "lowfirst" || state.sort === "highfirst") {
      const av = a.latest ? a.latest.pct : (state.sort === "lowfirst" ? 2 : -1);
      const bv = b.latest ? b.latest.pct : (state.sort === "lowfirst" ? 2 : -1);
      if (av !== bv) return state.sort === "lowfirst" ? av - bv : bv - av;
    } else if (customOrder) {
      const ai = customOrder.indexOf(a.store), bi = customOrder.indexOf(b.store);
      const av = ai < 0 ? 1e9 : ai, bv = bi < 0 ? 1e9 : bi;
      if (av !== bv) return av - bv;
    }
    return a.store.localeCompare(b.store);
  });
  const avgs = weeks.map((w, wi) => {
    const vals = rows.map(r => r.entries[wi]).filter(e => e && e.pct != null).map(e => e.pct);
    return vals.length ? vals.reduce((x, y) => x + y, 0) / vals.length : null;
  });
  return { weeks, rows, avgs };
}

/* ============================== TOOLTIP ============================== */
const tooltip = document.getElementById("tooltip");
function showTooltip(x, y, build) {
  tooltip.textContent = "";
  build(tooltip);
  tooltip.style.display = "block";
  const r = tooltip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 12;
  if (top + r.height > innerHeight - 8) top = y - r.height - 12;
  tooltip.style.left = Math.max(6, left) + "px";
  tooltip.style.top = Math.max(6, top) + "px";
}
function hideTooltip() { tooltip.style.display = "none"; }
addEventListener("scroll", hideTooltip, true);
addEventListener("keydown", e => { if (e.key === "Escape") hideTooltip(); });

function ttRow(k, v, color) {
  const row = h("div", { class: "tt-row" });
  if (color) { const lk = h("span", { class: "lk" }); lk.style.borderTopColor = color; row.append(lk); }
  row.append(h("span", { class: "k" }, k), h("span", { class: "v" }, v));
  return row;
}

/* ============================== LINE CHART ============================== */
function lineChart({ series, weeks, height = 250, endLabels = false }) {
  const wrap = h("div", { class: "chart-wrap" });
  let lastW = 0;
  function draw() {
    const W = wrap.clientWidth;
    if (!W || W < 100) return;
    lastW = W;
    wrap.textContent = "";
    const H = height, padL = 42, padR = endLabels ? 108 : 18, padT = 12, padB = 28;
    const n = weeks.length;
    const xs = i => n <= 1 ? padL + (W - padL - padR) / 2 : padL + (W - padL - padR) * (i / (n - 1));
    let vmin = Infinity, vmax = -Infinity;
    for (const s of series) for (const v of s.values) if (v != null) { vmin = Math.min(vmin, v); vmax = Math.max(vmax, v); }
    if (!isFinite(vmin)) { vmin = 0.9; vmax = 1.0; }
    let lo = Math.floor(vmin * 100 - 0.6), hi = Math.ceil(vmax * 100 + 0.6);
    if (hi - lo < 3) { lo -= 1; hi += 1; }
    const step = (hi - lo) <= 6 ? 1 : (hi - lo) <= 12 ? 2 : 5;
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const ys = v => padT + (H - padT - padB) * (1 - (v * 100 - lo) / (hi - lo));

    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("width", W); svg.setAttribute("height", H);
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const css = getComputedStyle(document.documentElement);
    const C = v => css.getPropertyValue(v).trim();
    const mk = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };

    for (let g = lo; g <= hi; g += step) {
      svg.append(mk("line", { x1: padL, x2: W - padR, y1: ys(g / 100), y2: ys(g / 100), stroke: g === lo ? C("--baseline") : C("--grid"), "stroke-width": 1 }));
      const t = mk("text", { x: padL - 7, y: ys(g / 100) + 3.5, "text-anchor": "end", "font-size": 11, fill: C("--muted") });
      t.textContent = g + "%";
      svg.append(t);
    }
    const every = Math.ceil(n / Math.max(3, Math.floor((W - padL - padR) / 62)));
    weeks.forEach((w, i) => {
      if (i % every && i !== n - 1) return;
      if (i !== n - 1 && n - 1 - i < every * 0.6) return;
      const t = mk("text", { x: xs(i), y: H - 9, "text-anchor": "middle", "font-size": 11, fill: C("--muted") });
      t.textContent = w.label;
      svg.append(t);
    });

    const colors = series.map((s, i) => C(s.colorVar || SERIES_VARS[i % SERIES_VARS.length]));
    series.forEach((s, si) => {
      let seg = [];
      const flush = () => {
        if (seg.length > 1) svg.append(mk("polyline", { points: seg.map(p => p.join(",")).join(" "), fill: "none", stroke: colors[si], "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
        seg = [];
      };
      s.values.forEach((v, i) => { if (v == null) flush(); else seg.push([xs(i), ys(v)]); });
      flush();
      s.values.forEach((v, i) => {
        if (v == null) return;
        const solo = (i === 0 || s.values[i - 1] == null) && (i === n - 1 || s.values[i + 1] == null);
        svg.append(mk("circle", { cx: xs(i), cy: ys(v), r: solo ? 3.5 : (i === n - 1 ? 3 : 2.2), fill: colors[si], stroke: C("--surface-1"), "stroke-width": 2 }));
      });
    });

    if (endLabels) {
      const ends = series.map((s, si) => {
        for (let i = n - 1; i >= 0; i--) if (s.values[i] != null) return { y: ys(s.values[i]), name: s.name, color: colors[si], v: s.values[i] };
        return null;
      }).filter(Boolean).sort((a, b) => a.y - b.y);
      for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 15) ends[i].y = ends[i - 1].y + 15;
      for (const e of ends) {
        const lk = mk("line", { x1: W - padR + 6, x2: W - padR + 20, y1: e.y, y2: e.y, stroke: e.color, "stroke-width": 2.5 });
        const t = mk("text", { x: W - padR + 25, y: e.y + 3.5, "font-size": 11.5, fill: C("--ink-2") });
        t.textContent = e.name;
        svg.append(lk, t);
      }
    }

    const vline = mk("line", { y1: padT, y2: H - padB, stroke: C("--baseline"), "stroke-width": 1, visibility: "hidden" });
    svg.append(vline);
    const hit = mk("rect", { x: padL, y: padT, width: Math.max(1, W - padL - padR), height: H - padT - padB, fill: "transparent" });
    hit.style.cursor = "crosshair";
    hit.addEventListener("pointermove", ev => {
      const rect = svg.getBoundingClientRect();
      const px = ev.clientX - rect.left;
      let best = 0, bd = Infinity;
      for (let i = 0; i < n; i++) { const d = Math.abs(xs(i) - px); if (d < bd) { bd = d; best = i; } }
      vline.setAttribute("x1", xs(best)); vline.setAttribute("x2", xs(best));
      vline.setAttribute("visibility", "visible");
      showTooltip(ev.clientX, ev.clientY, el => {
        el.append(h("div", { class: "tt-title" }, "Week of " + weeks[best].full));
        series.forEach((s, si) => {
          const v = s.values[best];
          el.append(ttRow(s.name, v == null ? "—" : fmtPct(v) + "%", colors[si]));
        });
      });
    });
    hit.addEventListener("pointerleave", () => { vline.setAttribute("visibility", "hidden"); hideTooltip(); });
    svg.append(hit);
    wrap.append(svg);
  }
  const ro = new ResizeObserver(() => { if (Math.abs(wrap.clientWidth - lastW) > 4) draw(); });
  ro.observe(wrap);
  setTimeout(draw, 0);
  return wrap;
}

/* ============================== WEEKLY ADJUSTMENTS ============================== */
const ADJ_OPTIONS = [["", "—"], ["done", "Done"], ["pending", "Pending"], ["error", "Error"]];
const ADJ_LABEL = { done: "Done", pending: "Pending", error: "Error" };
function adjEnabled() { return !!(db && state.user); }
function adjDocId(brand, store, serial) {
  return (state.country + "_" + brand.sheet + "_" + store + "_" + Math.round(serial)).replace(/[\/\s]+/g, "-");
}
function getAdj(brand, store, serial) {
  const m = state.adj[state.country];
  return m ? m[adjDocId(brand, store, serial)] : null;
}
async function loadAdjustments() {
  if (!adjEnabled()) return;
  const cid = state.country;
  try {
    const snap = await db.collection("adjustments").where("country", "==", cid).get();
    const m = {};
    snap.forEach(d => { m[d.id] = d.data(); });
    state.adj[cid] = m;
    if (cid === state.country && state.view === "dash") renderApp();
  } catch (e) {
    adjErrBanner("Couldn't load adjustment statuses", e);
  }
}
function adjErrBanner(prefix, e) {
  bannerSlot.textContent = "";
  bannerSlot.append(h("div", { class: "banner", role: "alert" }, prefix + ": " + ((e && e.message) || e)));
}
async function saveAdj(brand, week, store, patch) {
  const id = adjDocId(brand, store, week.serial);
  const cur = getAdj(brand, store, week.serial) || {};
  const next = {
    country: state.country, brand: brand.sheet, store,
    week: Math.round(week.serial), weekLabel: week.full,
    status: "status" in patch ? patch.status : (cur.status || ""),
    remark: "remark" in patch ? patch.remark : (cur.remark || ""),
    qtyMissing: "qtyMissing" in patch ? patch.qtyMissing : (cur.qtyMissing || ""),
    qtyUpdateLoc: "qtyUpdateLoc" in patch ? patch.qtyUpdateLoc : (cur.qtyUpdateLoc || ""),
    qtyCheckIn: "qtyCheckIn" in patch ? patch.qtyCheckIn : (cur.qtyCheckIn || ""),
    updatedBy: state.user.email, updatedByName: state.user.name || "",
    updatedAt: new Date().toISOString(),
  };
  const ref = db.collection("adjustments").doc(id);
  const m = state.adj[state.country] = state.adj[state.country] || {};
  if (!next.status && !next.remark && !next.qtyMissing && !next.qtyUpdateLoc && !next.qtyCheckIn) { await ref.delete(); delete m[id]; }
  else { await ref.set(next); m[id] = next; }
  renderApp();
  // If the editor popup is open for this same store & week, refresh it in place
  if (popoverOpen && popCtx && popCtx.brand.sheet === brand.sheet && popCtx.store === store
      && Math.round(popCtx.week.serial) === Math.round(week.serial)) {
    openAdjEditor(popCtx.rect, popCtx.brand, popCtx.week, popCtx.store, popCtx.entry);
  }
}

/* ---- Custom store sequence (shared, admin-arranged) ---- */
function storeOrderId(brand) { return (state.country + "_" + brand.sheet).replace(/[\/\s]+/g, "-"); }
function getStoreOrder(brand) {
  const m = state.order[state.country];
  const rec = m ? m[storeOrderId(brand)] : null;
  return rec && Array.isArray(rec.order) ? rec.order : null;
}
async function loadStoreOrders() {
  if (!adjEnabled()) return;
  const cid = state.country;
  try {
    const snap = await db.collection("storeOrders").where("country", "==", cid).get();
    const m = {};
    snap.forEach(d => { m[d.id] = d.data(); });
    state.order[cid] = m;
    if (cid === state.country && state.view === "dash") renderApp();
  } catch (e) {
    adjErrBanner("Couldn't load the store sequence", e);
  }
}
async function moveStore(brand, rows, store, dir) {
  const seq = rows.map(r => r.store);
  const i = seq.indexOf(store), j = i + dir;
  if (i < 0 || j < 0 || j >= seq.length) return;
  [seq[i], seq[j]] = [seq[j], seq[i]];
  const id = storeOrderId(brand);
  const rec = {
    country: state.country, brand: brand.sheet, order: seq,
    updatedBy: state.user.email, updatedByName: state.user.name || "",
    updatedAt: new Date().toISOString(),
  };
  try {
    await db.collection("storeOrders").doc(id).set(rec);
    const m = state.order[state.country] = state.order[state.country] || {};
    m[id] = rec;
    renderApp();
  } catch (e) { adjErrBanner("Could not save the store sequence", e); }
}

const popover = document.getElementById("popover");

let popCtx = null;   // context of the open editor: {brand, week, store, entry, rect}
function closePopover() { popover.style.display = "none"; popover.textContent = ""; popoverOpen = false; popCtx = null; }
document.addEventListener("click", e => { if (popoverOpen && !popover.contains(e.target)) closePopover(); });
addEventListener("keydown", e => { if (e.key === "Escape") closePopover(); });
function openAdjEditor(anchor, brand, week, store, entry) {
  hideTooltip();
  closePopover();
  const cur = getAdj(brand, store, week.serial) || {};
  const sel = h("select", null, ADJ_OPTIONS.map(([v, t]) => h("option", { value: v, selected: (cur.status || "") === v ? "" : null }, t)));
  const ta = h("textarea", { placeholder: "Remark — what is the problem / what was adjusted?" });
  ta.value = cur.remark || "";
  const err = h("div", { class: "auth-err" }, "");
  popover.append(h("h3", null, store + " — week of " + week.full));
  if (entry) {
    const info = [];
    if (entry.pct != null) info.push(["Cycle count", fmtPct(entry.pct) + "%"]);
    if (entry.parts && entry.parts.length > 1) info.push(["Parts 1–" + entry.parts.length, entry.parts.map(p => fmtPct(p)).join(" / ")]);
    if (entry.status) info.push(["Status", entry.status]);
    if (entry.countDate) info.push(["Counted", entry.countDate]);
    if (entry.missing) info.push(["Missing (check out)", entry.missing]);
    if (entry.updateLoc) info.push(["Update location", entry.updateLoc]);
    if (entry.checkIn) info.push(["Check in", entry.checkIn]);
    if (entry.remark) info.push(["Remark", entry.remark]);
    for (const [k, v] of info) popover.append(h("div", { class: "irow" }, h("span", { class: "k" }, k), h("span", { class: "v" }, v)));
    popover.append(h("div", { class: "sep" }));
  }
  const qMissing = h("input", { type: "number", min: "0", step: "1", placeholder: "qty" });
  qMissing.value = cur.qtyMissing != null ? cur.qtyMissing : "";
  const qUpdate = h("input", { type: "number", min: "0", step: "1", placeholder: "qty" });
  qUpdate.value = cur.qtyUpdateLoc != null ? cur.qtyUpdateLoc : "";
  const qCheckIn = h("input", { type: "number", min: "0", step: "1", placeholder: "qty" });
  qCheckIn.value = cur.qtyCheckIn != null ? cur.qtyCheckIn : "";
  popover.append(
    h("div", null, "Adjustment status ", sel),
    h("div", { class: "qrow" }, h("label", null, "Missing (Check Out)"), qMissing),
    h("div", { class: "qrow" }, h("label", null, "Update Location"), qUpdate),
    h("div", { class: "qrow" }, h("label", null, "Check In"), qCheckIn),
    ta);
  if (cur.updatedBy) popover.append(h("div", { style: "color:var(--muted); font-size:11.5px; margin-top:6px;" }, "Last saved by " + (cur.updatedByName || cur.updatedBy)));
  popover.append(
    err,
    h("div", { class: "prow" },
      h("button", { onclick: closePopover }, "Cancel"),
      h("button", { class: "primary", onclick: async ev => {
        ev.target.disabled = true;
        try {
          await saveAdj(brand, week, store, {
            status: sel.value, remark: ta.value.trim(),
            qtyMissing: qMissing.value.trim(), qtyUpdateLoc: qUpdate.value.trim(), qtyCheckIn: qCheckIn.value.trim(),
          });
          closePopover();
        }
        catch (e2) { err.textContent = "Could not save: " + ((e2 && e2.message) || e2); ev.target.disabled = false; }
      } }, "Save")));
  popover.style.display = "block";
  const rr = anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : anchor;
  const r = { left: rr.left, top: rr.top, bottom: rr.bottom };
  popCtx = { brand, week, store, entry, rect: r };
  const pw = 300, ph = popover.offsetHeight || 220;
  const left = Math.min(innerWidth - pw - 10, Math.max(6, r.left));
  let top = r.bottom + 6;
  if (top + ph > innerHeight - 8) top = Math.max(6, r.top - ph - 6);
  popover.style.left = left + "px"; popover.style.top = top + "px";
  setTimeout(() => { popoverOpen = true; }, 0);   // skip the click that opened it
}

/* ============================== RENDER: DASHBOARD ============================== */
const contentEl = document.getElementById("content");
const tabsEl = document.getElementById("tabs");
const filtersEl = document.getElementById("filters");

function classify(pct) {
  if (pct == null) return null;
  if (isHigh(pct)) return "good";
  if (isLow(pct)) return "low";
  return "mid";
}

function renderTitle() {
  const box = document.getElementById("titleBox");
  box.textContent = "";
  const cur = country();
  document.title = "cyclecountreport_" + cur.id.toLowerCase();
  const sheetA = document.getElementById("sheetA");
  if (sheetA) sheetA.href = "https://docs.google.com/spreadsheets/d/" + cur.sheetId + "/edit";
  const menu = h("div", { class: "titlemenu" });
  const allowed = allowedCountries();
  for (const c of allowed) {
    menu.append(h("button", {
      onclick: () => {
        menu.classList.remove("open");
        if (c.id === state.country) return;
        state.country = c.id;
        localStorage.setItem("cc.country", c.id);
        state.view = "dash";
        renderApp();
        ensureCountryData();
      }
    }, h("span", { class: "chk" }, c.id === cur.id ? "✓" : ""), c.title));

    onclick: ev => { ev.stopPropagation(); menu.classList.toggle("open"); } },

}
document.addEventListener("click", () => {
  const m = document.querySelector(".titlemenu.open");
  if (m) m.classList.remove("open");
});

function renderTabs() {
  tabsEl.textContent = "";
  if (state.view !== "dash") return;
  const brands = activeBrands();
  const mkTab = (id, label, flags) => {
    const b = h("button", { class: "tab" + (state.active === id ? " active" : ""), onclick: () => { state.active = id; localStorage.setItem("cc.tab", id); renderApp(); } }, label);
    if (flags > 0) b.append(h("span", { class: "flagn", title: flags + " store(s) consistently low" }, String(flags)));

function renderFilters() {
  filtersEl.textContent = "";
  if (state.view !== "dash") return;
  filtersEl.append(
    h("label", null, "Weeks",
      h("select", { onchange: e => { state.window = +e.target.value; localStorage.setItem("cc.window", state.window); renderApp(); } },
        [[8, "Last 8"], [12, "Last 12"], [26, "Last 26"], [0, "All"]].map(([v, t]) =>
          h("option", { value: v, selected: state.window === v ? "" : null }, t)))),
    h("label", null, "Sort",
      h("select", { onchange: e => { state.sort = e.target.value; localStorage.setItem("cc.sort", state.sort); renderApp(); } },
        [["store", "Store order"], ["lowfirst", "Lowest % first"], ["highfirst", "Highest % first"]].map(([v, t]) =>
          h("option", { value: v, selected: state.sort === v ? "" : null }, t)))),
    h("label", { title: "Cells at or above this are highlighted green" }, "High ≥",
      h("input", { type: "number", step: "0.5", min: "50", max: "100", value: state.greenT,
        onchange: e => { state.greenT = Math.min(100, Math.max(50, +e.target.value || 95)); localStorage.setItem("cc.greenT", state.greenT); renderApp(); } }), "%"),
    h("label", { title: "Cells at or below this are highlighted red" }, "Low ≤",
      h("input", { type: "number", step: "0.5", min: "50", max: "100", value: state.lowT,
        onchange: e => { state.lowT = Math.min(100, Math.max(50, +e.target.value || 94)); localStorage.setItem("cc.lowT", state.lowT); renderApp(); } }), "%"),
    h("div", { class: "legend" },
      legendKey("var(--wash-good)", "≥ " + state.greenT + "% high"),

      legendKey("var(--wash-low)", "≤ " + state.lowT + "% low"),

}
function legendKey(bg, text) {
  const sw = h("span", { class: "swatch" });
  sw.style.background = bg;
  return h("span", { class: "key" }, sw, text);
}

function deltaEl(d, opts) {
  if (d == null) return h("span", { class: "delta flat" }, "—");
  const eps = 0.0005;
  const cls = d > eps ? "up" : d < -eps ? "down" : "flat";
  const body = cls === "flat" ? "0.0 pt" : (d > 0 ? "▲ +" : "▼ −") + Math.abs(d * 100).toFixed(1) + " pt";
  return h("span", { class: "delta " + cls }, body + (opts && opts.suffix ? opts.suffix : ""));
}

function kpiTile(label, valueText, extra, sub, onclick) {
  return h("div", { class: "kpi" + (onclick ? " click" : ""), onclick },
    h("div", { class: "lab" }, label),
    h("div", { class: "val" }, valueText),
    extra || null,
    sub ? h("div", { class: "sub2" }, sub) : null);
}

function cellTooltip(ev, brand, week, e) {
  showTooltip(ev.clientX, ev.clientY, el => {
    el.append(h("div", { class: "tt-title" }, e.store + " — week of " + week.full));
    if (e.pct != null) el.append(ttRow("Cycle count", fmtPct(e.pct) + "%"));
    if (e.parts.length > 1) el.append(ttRow("Parts 1–" + e.parts.length, e.parts.map(p => fmtPct(p)).join(" / ")));
    if (e.status) el.append(ttRow("Status", e.status));
    if (e.countDate) el.append(ttRow("Counted", e.countDate));
    if (e.missing) el.append(ttRow("Missing (check out)", e.missing));
    if (e.updateLoc) el.append(ttRow("Update location", e.updateLoc));
    if (e.checkIn) el.append(ttRow("Check in", e.checkIn));
    if (e.remark) el.append(ttRow("Remark", e.remark));
    if (adjEnabled()) {
      const adj = getAdj(brand, e.store, week.serial);
      if (adj && (adj.status || adj.remark || adj.qtyMissing || adj.qtyUpdateLoc || adj.qtyCheckIn)) {
        el.append(ttRow("Adjustment", ADJ_LABEL[adj.status] || "—"));
        if (adj.qtyMissing) el.append(ttRow("Adj. missing (check out)", adj.qtyMissing));
        if (adj.qtyUpdateLoc) el.append(ttRow("Adj. update location", adj.qtyUpdateLoc));
        if (adj.qtyCheckIn) el.append(ttRow("Adj. check in", adj.qtyCheckIn));
        if (adj.remark) el.append(ttRow("Adj. remark", adj.remark));
        if (adj.updatedByName || adj.updatedBy) el.append(ttRow("By", adj.updatedByName || adj.updatedBy));
      }
      el.append(h("div", { style: "color:var(--muted); font-size:11px; margin-top:4px;" }, "Click cell to edit this week's adjustment"));
    }
  });
}

function shortStatus(s) {
  if (!s) return "—";
  const t = s.toLowerCase();
  if (t.includes("pend")) return "pending";
  if (t.includes("not")) return "not done";
  return t.length > 9 ? t.slice(0, 8) + "…" : t;
}

function renderBrand(brand) {
  const { weeks, rows, avgs } = buildMatrix(brand);
  const frag = document.createDocumentFragment();
  const li = avgs.length - 1;
  const latestAvg = avgs[li];
  let prevAvg = null;
  for (let i = li - 1; i >= 0; i--) if (avgs[i] != null) { prevAvg = avgs[i]; break; }
  const latestWeek = weeks[li];
  const countedN = rows.filter(r => r.entries[li] && r.entries[li].pct != null).length;
  const flagged = rows.filter(r => r.chronicLow);
  const strong = rows.filter(r => r.chronicHigh && !r.chronicLow);

  frag.append(h("div", { class: "kpis" },
    kpiTile("Latest week average (" + (latestWeek ? latestWeek.label : "—") + ")",
      [latestAvg != null ? fmtPct(latestAvg) : "—", h("span", { class: "unit" }, "%")],
      latestAvg != null && prevAvg != null ? deltaEl(latestAvg - prevAvg, { suffix: " vs prior wk" }) : null),
    kpiTile("Stores counted", countedN + " / " + rows.length, null, "in latest week"),
    kpiTile("Consistently low", String(flagged.length), null, "at/below " + state.lowT + "% in 3+ of last 4 counts"),
    kpiTile("Consistently high", String(strong.length), null, "at/above " + state.greenT + "% in 3+ of last 4 counts"),
  ));

  const attn = h("section", { class: "card attention" },
    h("h2", null, "⚠ Needs attention — consistently low"),
    h("div", { class: "h2sub" }, "At or below " + state.lowT + "% in at least 3 of the last 4 counted weeks"));
  if (!flagged.length) attn.append(h("div", { class: "allok" }, "No stores are consistently low in the selected period. ✓"));
  else for (const r of [...flagged].sort((a, b) => (a.latest ? a.latest.pct : 1) - (b.latest ? b.latest.pct : 1))) {
    attn.append(h("div", { class: "attn-row" },
      h("span", { class: "attn-store" }, r.store),
      h("span", { class: "attn-chips" }, r.recent.map(c =>
        h("span", { class: "attn-chip " + (isLow(c.pct) ? "low" : "ok"), title: weeks[c.wi].full }, fmtPct(c.pct)))),
      h("span", { class: "attn-note" },
        (r.streak >= 2 ? r.streak + " weeks in a row at/below " + state.lowT + "%" : "low in " + r.recent.filter(c => isLow(c.pct)).length + " of last " + r.recent.length + " counts")
        + (r.latest ? " · latest " + fmtPct(r.latest.pct) + "%" : ""))));
  }
  frag.append(attn);

  if (strong.length) {
    frag.append(h("section", { class: "card" },
      h("h2", null, "Performing well"),
      h("div", { class: "h2sub" }, "At or above " + state.greenT + "% in 3+ of the last 4 counted weeks"),
      h("div", { class: "goodchips" }, strong.map(r =>
        h("span", { class: "goodchip" }, r.store + " ", h("span", { class: "v" }, r.latest ? fmtPct(r.latest.pct) + "%" : ""))))));
  }

  const table = h("table", { class: "matrix" });
  const canReorder = state.sort === "store" && adjEnabled() && state.user.role === "admin";
  const storeTh = h("th", { class: "rowhead" }, "Store");
  if (canReorder) {
    storeTh.append(h("button", {
      class: "edit-seq" + (state.reorder ? " on" : ""),
      title: state.reorder ? "Done rearranging — hide the arrows" : "Rearrange the store sequence",
      onclick: () => { state.reorder = !state.reorder; renderApp(); },
    }, state.reorder ? "✓ Done" : "✎"));
  }
  const headRow = h("tr", null, storeTh);
  weeks.forEach((w, wi) => headRow.append(h("th", { class: wi === li ? "latestcol" : null, title: w.full }, w.label)));
  headRow.append(h("th", { title: "Change: latest vs previous counted week" }, "Δ wk"));
  if (adjEnabled() && latestWeek) headRow.append(h("th", { title: "Weekly adjustment for the latest week (" + latestWeek.label + ") — pick a status; ✎ adds a remark" }, "Adjustment"));
  table.append(h("thead", null, headRow));
  const tbody = h("tbody");
  for (const r of rows) {
    const tr = h("tr", { class: r.chronicLow ? "chronic" : null });
    const th = h("th", { class: "rowhead" }, r.store);
    if (r.chronicLow) th.append(h("span", { class: "flagico", title: "Consistently low" }, "⚠"));
    else if (r.chronicHigh) th.append(h("span", { class: "starico", title: "Consistently high" }, "✓"));
    if (canReorder && state.reorder) {
      th.append(
        h("button", { class: "mv", title: "Move up", onclick: ev => { ev.stopPropagation(); moveStore(brand, rows, r.store, -1); } }, "▲"),
        h("button", { class: "mv", title: "Move down", onclick: ev => { ev.stopPropagation(); moveStore(brand, rows, r.store, 1); } }, "▼"));
    }
    tr.append(th);
    r.entries.forEach((e, wi) => {
      if (!e || (e.pct == null && !e.status && !e.countDate)) { tr.append(h("td", { class: "cell nodata" }, "–")); return; }
      const adj = adjEnabled() ? getAdj(brand, r.store, weeks[wi].serial) : null;
      const dot = adj && adj.status ? h("span", { class: "adjdot " + adj.status, title: "Adjustment: " + ADJ_LABEL[adj.status] }) : null;
      let td;
      if (e.pct == null) {
        td = h("td", { class: "cell pending hasdata", tabindex: "0" }, shortStatus(e.status), dot);
      } else {
        td = h("td", { class: "cell hasdata " + classify(e.pct), tabindex: "0",
          "aria-label": r.store + " week of " + weeks[wi].full + ": " + fmtPct(e.pct) + "%" }, fmtPct(e.pct), dot);
      }
      wireCell(td, brand, weeks[wi], e);
      if (adjEnabled()) td.addEventListener("click", () => openAdjEditor(td, brand, weeks[wi], r.store, e));
      tr.append(td);
    });
    tr.append(h("td", { class: "dcell" }, deltaEl(r.delta)));
    if (adjEnabled() && latestWeek) {
      const adj = getAdj(brand, r.store, latestWeek.serial) || {};
      const sel = h("select", { class: "adjsel" + (adj.status ? " s-" + adj.status : ""),
        onchange: async ev => {
          try { await saveAdj(brand, latestWeek, r.store, { status: ev.target.value }); }
          catch (e2) { adjErrBanner("Could not save adjustment", e2); }
        } },
        ADJ_OPTIONS.map(([v, t]) => h("option", { value: v, selected: (adj.status || "") === v ? "" : null }, t)));
      const rem = h("button", { class: "adjrem" + (adj.remark ? " has" : ""), title: adj.remark || "Add remark",
        onclick: ev => { ev.stopPropagation(); openAdjEditor(ev.target, brand, latestWeek, r.store, r.entries[li] || null); } }, "✎");
      tr.append(h("td", null, h("div", { class: "adjwrap" }, sel, rem)));
    }
    tbody.append(tr);
  }
  const avgTr = h("tr", { class: "avgrow" }, h("th", { class: "rowhead" }, "Brand average"));
  avgs.forEach(a => avgTr.append(h("td", null, a != null ? fmtPct(a) : "–")));
  let avgDelta = null;
  if (latestAvg != null && prevAvg != null) avgDelta = latestAvg - prevAvg;
  avgTr.append(h("td", { class: "dcell" }, deltaEl(avgDelta)));
  if (adjEnabled() && latestWeek) avgTr.append(h("td"));
  tbody.append(avgTr);
  table.append(tbody);

  frag.append(h("section", { class: "card" },
    h("h2", null, "Weekly cycle count % by store"),
    h("div", { class: "h2sub" }, "Hover a cell for count details" + (adjEnabled() ? " · click a cell to record that week's adjustment · the Adjustment column edits the latest week" : "")),
    h("div", { class: "matrix-scroll" }, table)));

  frag.append(h("section", { class: "card" },
    h("h2", null, brand.name + " — average trend"),
    h("div", { class: "h2sub" }, "Brand average cycle count % per week (values in the table above)"),
    lineChart({ weeks, series: [{ name: brand.name, values: avgs, colorVar: "--series-1" }] })));

  return frag;
}

function wireCell(td, brand, week, e) {
  td.addEventListener("pointermove", ev => cellTooltip(ev, brand, week, e));
  td.addEventListener("pointerleave", hideTooltip);
  td.addEventListener("focus", () => {
    const r = td.getBoundingClientRect();
    cellTooltip({ clientX: r.left + r.width / 2, clientY: r.bottom }, brand, week, e);
  });
  td.addEventListener("blur", hideTooltip);
}

function renderOverview() {
  const frag = document.createDocumentFragment();
  const per = activeBrands().map(b => ({ brand: b, m: buildMatrix(b) }));

  const serialSet = new Map();
  for (const { m } of per) for (const w of m.weeks) serialSet.set(w.serial, w);
  const weeks = [...serialSet.values()].sort((a, b) => a.serial - b.serial);
  const idx = new Map(weeks.map((w, i) => [w.serial, i]));

  const kpis = h("div", { class: "kpis" });
  const seriesList = [];
  per.forEach(({ brand, m }, bi) => {
    const values = new Array(weeks.length).fill(null);
    m.weeks.forEach((w, wi) => { values[idx.get(w.serial)] = m.avgs[wi]; });
    seriesList.push({ name: brand.name, values, colorVar: SERIES_VARS[bi % SERIES_VARS.length] });
    const counted = m.avgs.map((a, wi) => a != null ? { a, wi } : null).filter(Boolean);
    const latest = counted[counted.length - 1] || null;
    const prev = counted[counted.length - 2] || null;
    const flags = m.rows.filter(r => r.chronicLow).length;
    kpis.append(kpiTile(brand.name,
      [latest ? fmtPct(latest.a) : "—", h("span", { class: "unit" }, "%")],
      latest && prev ? deltaEl(latest.a - prev.a, { suffix: " vs prior wk" }) : null,
      flags ? flags + " store(s) consistently low" : "no consistently-low stores",
      () => { state.active = brand.sheet; localStorage.setItem("cc.tab", brand.sheet); renderApp(); }));
  });
  frag.append(kpis);

  const legend = h("div", { class: "chart-legend" }, seriesList.map(s => {
    const lk = h("span", { class: "linekey" });
    lk.style.borderTopColor = getComputedStyle(document.documentElement).getPropertyValue(s.colorVar).trim();
    return h("span", { class: "key" }, lk, s.name);
  }));
  const tbl = h("table", null,
    h("tr", null, h("th", null, "Brand"), weeks.map(w => h("th", null, w.label))),
    seriesList.map(s => h("tr", null, h("td", null, s.name), s.values.map(v => h("td", null, v != null ? fmtPct(v) : "–")))));
  frag.append(h("section", { class: "card" },
    h("h2", null, "Brand average by week"),
    h("div", { class: "h2sub" }, "Average cycle count % across all counted stores in each brand"),
    legend,
    lineChart({ weeks, series: seriesList, height: 280, endLabels: true }),
    h("details", { class: "tblview" }, h("summary", null, "Show data table"), tbl)));

  const watch = [];
  per.forEach(({ brand, m }) => {
    for (const r of m.rows) if (r.chronicLow) watch.push({ brand, r, weeks: m.weeks });
  });
  watch.sort((a, b) => (a.r.latest ? a.r.latest.pct : 1) - (b.r.latest ? b.r.latest.pct : 1));
  const card = h("section", { class: "card attention" },
    h("h2", null, "⚠ Group watchlist — consistently low stores"),
    h("div", { class: "h2sub" }, "At or below " + state.lowT + "% in at least 3 of the last 4 counted weeks"));
  if (!watch.length) card.append(h("div", { class: "allok" }, "No stores are consistently low across the Group. ✓"));
  else for (const w of watch) {
    card.append(h("div", { class: "attn-row" },
      h("span", { class: "attn-store" }, w.r.store),
      h("span", { class: "attn-brand" }, w.brand.name),
      h("span", { class: "attn-chips" }, w.r.recent.map(c =>
        h("span", { class: "attn-chip " + (isLow(c.pct) ? "low" : "ok"), title: w.weeks[c.wi].full }, fmtPct(c.pct)))),
      h("span", { class: "attn-note" },
        (w.r.streak >= 2 ? w.r.streak + " wks in a row" : "low " + w.r.recent.filter(c => isLow(c.pct)).length + " of last " + w.r.recent.length)
        + (w.r.latest ? " · latest " + fmtPct(w.r.latest.pct) + "%" : ""))));
  }
  frag.append(card);
  return frag;
}

      h("div", { style: "margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;" },
        h("button", { class: "primary", onclick: async ev => {
          const btn = ev.target; btn.disabled = true;
          try {
            await db.collection("users").doc(u.uid).update({ name: nameInput.value.trim() });
            state.user.name = nameInput.value.trim();
            profMsg.textContent = "Saved.";
          } catch (e) { profMsg.textContent = "Could not save: " + e.message; profMsg.className = "auth-err"; }
          btn.disabled = false;
        } }, "Save profile"),
        h("button", { onclick: async ev => {
          const btn = ev.target; btn.disabled = true;
          try { await auth.sendPasswordResetEmail(u.email); profMsg.textContent = "Password reset email sent to " + u.email + "."; }
          catch (e) { profMsg.textContent = "Could not send: " + e.message; profMsg.className = "auth-err"; }
          btn.disabled = false;
        } }, "Change password (email link)")),
      profMsg)));

  // ---- Roles (admin only) ----
  if (u.role === "admin") {
    const card = h("section", { class: "card" },
      h("h2", null, "Roles & access"),
      h("div", { class: "h2sub" }, "Only Administrators can change roles. New sign-ups appear here as 'Pending' until you grant access."));
    const holder = h("div", null, h("div", { class: "loading" }, "Loading users…"));
    card.append(holder);
    frag.append(card);
    db.collection("users").get().then(snap => {
      holder.textContent = "";
      const tbl = h("table", { class: "roletbl" },
        h("thead", null, h("tr", null,
          h("th", null, "Name"), h("th", null, "Email"), h("th", null, "Role"),
          h("th", null, "Country access"), h("th", null, ""))));
      const tb = h("tbody");
      const docs = snap.docs.sort((a, b) => (a.data().email || "").localeCompare(b.data().email || ""));
      for (const d of docs) {
        const row = d.data(); const uid = d.id;
        const roleSel = h("select", null,
          [["admin", "Administrator"], ["executive", "Executive"], ["pending", "Pending (no access)"]].map(([v, t]) =>
            h("option", { value: v, selected: (row.role || "pending") === v ? "" : null }, t)));
        const boxes = COUNTRIES.map(c => {
          const cb = h("input", { type: "checkbox" });
          cb.checked = (row.countries || []).includes(c.id);
          return { id: c.id, cb, el: h("label", null, cb, c.id) };
        });
        const msg = h("span", { class: "auth-ok" }, "");
        const save = h("button", { class: "primary", onclick: async ev => {
          const btn = ev.target; btn.disabled = true; msg.textContent = "";
          try {
            await db.collection("users").doc(uid).update({
              role: roleSel.value,
              countries: boxes.filter(b => b.cb.checked).map(b => b.id),
            });
            msg.textContent = "Saved ✓";
            if (uid === state.user.uid) { state.user.role = roleSel.value; renderApp(); }
          } catch (e) { msg.textContent = "Failed: " + e.message; msg.className = "auth-err"; }
          btn.disabled = false;
        } }, "Save");
        tb.append(h("tr", null,
          h("td", null, row.name || "—", uid === state.user.uid ? " (you)" : ""),
          h("td", null, row.email || uid),
          h("td", null, roleSel),
          h("td", null, h("span", { class: "cty" }, boxes.map(b => b.el))),
          h("td", null, save, " ", msg)));
      }
      tbl.append(tb);
      holder.append(h("div", { class: "matrix-scroll" }, tbl));
    }).catch(e => {
      holder.textContent = "";
      holder.append(h("div", { class: "fatal" }, "Could not load users: " + e.message));
    });
  }
  return frag;
}

/* ============================== APP RENDER + REFRESH ============================== */
const updatedEl = document.getElementById("updated");
const bannerSlot = document.getElementById("bannerSlot");

function renderApp() {
  renderTitle();
  renderTabs();
  renderFilters();
  hideTooltip();
  contentEl.textContent = "";
  if (state.view === "settings" && state.user) { contentEl.append(renderSettings()); return; }
  state.view = "dash";
  const allowed = allowedCountries();
  if (!allowed.length) {
    contentEl.append(h("div", { class: "fatal" }, "Your account has no country access yet — ask an Administrator to grant it in Settings → Roles."));
    return;
  }
  if (!allowed.some(c => c.id === state.country)) {
    state.country = allowed[0].id;
    localStorage.setItem("cc.country", state.country);
    renderTitle();
  }
  const brands = activeBrands();
  if (!brands.length) { contentEl.append(h("div", { class: "loading" }, "Loading cycle count data from Google Sheets…")); return; }
  if (!brands.some(b => b.sheet === state.active) && state.active !== "overview") state.active = "overview";
  const brand = brands.find(b => b.sheet === state.active);
  contentEl.append(brand ? renderBrand(brand) : renderOverview());
}

function setUpdated() {
  updatedEl.textContent = "";
  updatedEl.classList.toggle("err", !!state.error);
  const d = state.data[state.country];
  const dot = h("span", { class: "dot" });
  if (d && d.fetchedAt) {
    updatedEl.append(dot, "Updated " + d.fetchedAt.toLocaleTimeString() + " · auto-refresh 5 min");
  } else if (state.error) {
    updatedEl.append(dot, "No data yet");
  }
}

async function refresh(first) {
  if (state.refreshing) return;
  state.refreshing = true;
  document.body.classList.add("refreshing");
  bannerSlot.textContent = "";
  const cid = state.country;
  try {
    const brands = await loadData(country().sheetId);
    state.data[cid] = { brands, fetchedAt: new Date() };
    state.error = null;
    renderApp();
  } catch (e) {
    state.error = e.message || String(e);
    const had = state.data[cid];
    if (first || !had) {
      contentEl.textContent = "";
      contentEl.append(h("div", { class: "fatal" }, "Couldn't load the dashboard. " + state.error));
    } else {
      bannerSlot.append(h("div", { class: "banner", role: "alert" },
        "Refresh failed — showing data from " + had.fetchedAt.toLocaleTimeString() + ". " + state.error,
        h("button", { onclick: () => refresh(false) }, "Retry")));
    }
  } finally {
    state.refreshing = false;
    document.body.classList.remove("refreshing");
    setUpdated();
  }
}
function ensureCountryData() {
  const d = state.data[state.country];
  setUpdated();
  if (!d || Date.now() - d.fetchedAt.getTime() > REFRESH_MS) refresh(!d);
  if (adjEnabled() && !state.adj[state.country]) loadAdjustments();
  if (adjEnabled() && !state.order[state.country]) loadStoreOrders();
}

document.getElementById("btnRefresh").addEventListener("click", () => refresh(false));
document.getElementById("sheetLink").append(h("a", { href: "#", id: "sheetA", target: "_blank", rel: "noopener" }, "Open Google Sheet ↗"));

const themeBtn = document.getElementById("btnTheme");
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  themeBtn.textContent = t === "light" ? "☀" : t === "dark" ? "🌙" : "◐";
  themeBtn.title = "Theme: " + (t || "auto");
}
applyTheme(localStorage.getItem("cc.theme") || "");
themeBtn.addEventListener("click", () => {
  const cur = localStorage.getItem("cc.theme") || "";
  const next = cur === "" ? "light" : cur === "light" ? "dark" : "";
  localStorage.setItem("cc.theme", next);
  applyTheme(next);
  if (document.getElementById("appRoot").style.display !== "none") renderApp();
});

setInterval(() => {
  if (document.getElementById("appRoot").style.display !== "none") refresh(false);
}, REFRESH_MS);
document.addEventListener("visibilitychange", () => {
  if (document.hidden || document.getElementById("appRoot").style.display === "none") return;
  const d = state.data[state.country];
  if (d && Date.now() - d.fetchedAt.getTime() > 60000) refresh(false);
});

/* ============================== AUTH ============================== */
let auth = null, db = null;
const authRoot = document.getElementById("authRoot");

function startApp() {
  authRoot.style.display = "none";
  authRoot.textContent = "";
  document.getElementById("appRoot").style.display = "";
  document.getElementById("btnSettings").style.display = state.user ? "" : "none";
  document.getElementById("btnSignOut").style.display = state.user ? "" : "none";
  renderApp();
  ensureCountryData();
}
document.getElementById("btnSettings").addEventListener("click", () => {
  state.view = state.view === "settings" ? "dash" : "settings";
  renderApp();
});
document.getElementById("btnSignOut").addEventListener("click", async () => {
  if (auth) await auth.signOut();
});

function authCard(...kids) {
  authRoot.style.display = "";
  document.getElementById("appRoot").style.display = "none";
  authRoot.textContent = "";
  authRoot.append(h("div", { class: "auth-wrap" }, h("div", { class: "auth-card" }, ...kids)));
}
function friendlyAuthError(e) {
  const c = e && e.code || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "Wrong email or password.";
  if (c.includes("invalid-email")) return "That email address doesn't look right.";
  if (c.includes("email-already-in-use")) return "An account with this email already exists — sign in instead.";
  if (c.includes("weak-password")) return "Password too weak — use at least 6 characters.";
  if (c.includes("too-many-requests")) return "Too many attempts — wait a few minutes and try again.";
  if (c.includes("network")) return "Network problem — check your connection.";
  return (e && e.message) || String(e);
}

function showLogin(mode) {   // mode: 'signin' | 'signup' | 'reset'
  mode = mode || "signin";
  const email = h("input", { type: "email", autocomplete: "username", placeholder: "you@iora.com" });
  const pass = h("input", { type: "password", autocomplete: mode === "signup" ? "new-password" : "current-password", placeholder: "••••••••" });
  const name = h("input", { type: "text", autocomplete: "name", placeholder: "Your name" });
  const err = h("div", { class: "auth-err" }, "");
  const doSubmit = async () => {
    err.textContent = "";
    try {
      if (mode === "signin") {
        await auth.signInWithEmailAndPassword(email.value.trim(), pass.value);
      } else if (mode === "signup") {
        if (!name.value.trim()) { err.textContent = "Please enter your name."; return; }
        const cred = await auth.createUserWithEmailAndPassword(email.value.trim(), pass.value);
        try { await cred.user.updateProfile({ displayName: name.value.trim() }); } catch (_) {}
        sessionStorage.setItem("cc.signupName", name.value.trim());
        await cred.user.sendEmailVerification();
        // onAuthStateChanged routes to the verify screen
      } else {
        await auth.sendPasswordResetEmail(email.value.trim());
        err.className = "auth-ok";
        err.textContent = "Reset link sent — check your inbox.";
      }
    } catch (e) { err.className = "auth-err"; err.textContent = friendlyAuthError(e); }
  };
  const onEnter = e => { if (e.key === "Enter") doSubmit(); };
  email.addEventListener("keydown", onEnter); pass.addEventListener("keydown", onEnter);
  authCard(
    h("h1", null, "Cycle Count Report"),
    h("div", { class: "asub" }, mode === "signin" ? "Sign in to continue" : mode === "signup" ? "Create your account" : "Reset your password"),
    mode === "signup" ? h("label", null, "Name") : null,
    mode === "signup" ? name : null,
    h("label", null, "Email"), email,
    mode !== "reset" ? h("label", null, "Password") : null,
    mode !== "reset" ? pass : null,
    h("button", { class: "abtn", onclick: doSubmit }, mode === "signin" ? "Sign in" : mode === "signup" ? "Create account" : "Send reset link"),
    err,
    h("div", { class: "auth-links" },
      mode === "signin" ? h("a", { href: "#", onclick: e => { e.preventDefault(); showLogin("signup"); } }, "Create account")
                        : h("a", { href: "#", onclick: e => { e.preventDefault(); showLogin("signin"); } }, "Back to sign in"),
      mode === "signin" ? h("a", { href: "#", onclick: e => { e.preventDefault(); showLogin("reset"); } }, "Forgot password?") : null),
    mode === "signup" ? h("div", { class: "auth-note" }, "You'll receive a verification email. After verifying, an Administrator must approve your account before you can see the reports.") : null,
  );
}

function showVerify(user) {
  const msg = h("div", { class: "auth-ok" }, "");
  authCard(
    h("h1", null, "Verify your email"),
    h("div", { class: "asub" }, "We sent a verification link to " + user.email),
    h("div", { class: "auth-note" }, "Open the email and click the link, then come back here."),
    h("button", { class: "abtn", onclick: async () => {
      await user.reload();
      if (auth.currentUser && auth.currentUser.emailVerified) route(auth.currentUser);
      else { msg.className = "auth-err"; msg.textContent = "Not verified yet — check your inbox (and spam folder)."; }
    } }, "I've verified — continue"),
    msg,
    h("div", { class: "auth-links" },
      h("a", { href: "#", onclick: async e => { e.preventDefault(); try { await user.sendEmailVerification(); msg.className = "auth-ok"; msg.textContent = "Verification email re-sent."; } catch (er) { msg.className = "auth-err"; msg.textContent = friendlyAuthError(er); } } }, "Resend email"),
      h("a", { href: "#", onclick: e => { e.preventDefault(); auth.signOut(); } }, "Sign out")),
  );
}

function showPending(prof) {
  authCard(
    h("h1", null, "Awaiting approval"),
    h("div", { class: "asub" }, "Signed in as " + prof.email),
    h("div", { class: "auth-note" }, "Your account is verified but not yet approved. An Administrator needs to assign you a role in Settings → Roles before you can view the reports."),
    h("button", { class: "abtn", onclick: () => location.reload() }, "Check again"),
    h("div", { class: "auth-links" }, h("a", { href: "#", onclick: e => { e.preventDefault(); auth.signOut(); } }, "Sign out")),
  );
}

async function ensureProfile(user) {
  const ref = db.collection("users").doc(user.uid);
  const snap = await ref.get();
  if (snap.exists) return Object.assign({ uid: user.uid }, snap.data());
  const isBoss = (user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase();
  const prof = {
    name: sessionStorage.getItem("cc.signupName") || user.displayName || "",
    email: user.email,
    role: isBoss ? "admin" : "pending",
    countries: isBoss ? COUNTRIES.map(c => c.id) : [],
    created: new Date().toISOString(),
  };
  await ref.set(prof);
  return Object.assign({ uid: user.uid }, prof);
}

async function route(user) {
  if (!user) { state.user = null; showLogin("signin"); return; }
  if (!user.emailVerified) { showVerify(user); return; }
  try {
    await user.getIdToken(true);   // refresh token so email_verified is current in security rules
    const prof = await ensureProfile(user);
    if (!prof.role || prof.role === "pending") { state.user = null; showPending(prof); return; }
    state.user = prof;
    startApp();
  } catch (e) {
    authCard(h("h1", null, "Something went wrong"),
      h("div", { class: "auth-err" }, friendlyAuthError(e)),
      h("button", { class: "abtn", onclick: () => location.reload() }, "Reload"),
      h("div", { class: "auth-links" }, h("a", { href: "#", onclick: ev => { ev.preventDefault(); auth.signOut(); } }, "Sign out")));
  }
}

async function initAuth() {
  if (!FIREBASE_CONFIG) { startApp(); return; }   // sign-in disabled — open dashboard
  authCard(h("h1", null, "Cycle Count Report"), h("div", { class: "asub" }, "Loading sign-in…"));
  try {
    const V = "10.14.1";
    await loadScript("https://www.gstatic.com/firebasejs/" + V + "/firebase-app-compat.js");
    await loadScript("https://www.gstatic.com/firebasejs/" + V + "/firebase-auth-compat.js");
    await loadScript("https://www.gstatic.com/firebasejs/" + V + "/firebase-firestore-compat.js");
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    db = firebase.firestore();
    auth.onAuthStateChanged(route);
  } catch (e) {
    authCard(h("h1", null, "Sign-in unavailable"),
      h("div", { class: "auth-err" }, "Could not load the sign-in service: " + (e.message || e)),
      h("button", { class: "abtn", onclick: () => location.reload() }, "Retry"));
  }
}

/* ============================== BOOT ============================== */
if (typeof DecompressionStream === "undefined") {
  authCard(h("h1", null, "Browser too old"),
    h("div", { class: "auth-err" }, "Please open this dashboard in a recent version of Edge or Chrome."));
} else {
  initAuth();
}
</script>
